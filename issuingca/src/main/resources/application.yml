spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/pki_db?
    username: pki_user
    password: pki_pass
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect