# ==============================================================================
# Nginx Reverse Proxy Configuration — High Availability PKI Topology
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout 65;

    # Rate limiting zone for authentication endpoint (5 requests/minute per IP)
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # Rate limiting zone for public revocation endpoints (100 requests/second per IP)
    limit_req_zone $binary_remote_addr zone=revocation_limit:10m rate=100r/s;

    # --------------------------------------------------------------------------
    # Upstream: Main PKI API Cluster (>= 2 App Replicas for High Availability)
    # --------------------------------------------------------------------------
    upstream pki_api_cluster {
        least_conn;
        server app1:8080 max_fails=3 fail_timeout=10s;
        server app2:8080 max_fails=3 fail_timeout=10s;
    }

    # --------------------------------------------------------------------------
    # Upstream: Dedicated OCSP Responder Node(s)
    # --------------------------------------------------------------------------
    upstream ocsp_responder_node {
        server ocsp_node:8080 max_fails=2 fail_timeout=5s;
    }

    server {
        listen 80;
        server_name localhost;

        # Redirect HTTP to HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/tls.crt;
        ssl_certificate_key /etc/nginx/certs/tls.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # 1. Rate-Limited Login Route
        location /api/v1/auth/login {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://pki_api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Public OCSP Responder Route -> Dedicated OCSP Node
        location /api/v1/ocsp/ {
            limit_req zone=revocation_limit burst=50 nodelay;
            proxy_pass http://ocsp_responder_node;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Public CRL Download Routes -> Main Cluster
        location ~* ^/api/v1/ca/[^/]+/crl/latest\.(crl|pem)$ {
            limit_req zone=revocation_limit burst=50 nodelay;
            proxy_pass http://pki_api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 4. General API Routes -> Main Cluster
        location /api/ {
            proxy_pass http://pki_api_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 5. Frontend Static Files
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
