spring:
  datasource:
    url: ${DB_URL:jdbc:mariadb://localhost:3306/pki_db}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.mariadb.jdbc.Driver

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.MariaDBDialect

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

ldap:
  enabled: ${LDAP_ENABLED:false}
  url: ${LDAP_URL:ldap://localhost:389}
  base-dn: ${LDAP_BASE_DN:dc=example,dc=org}
  bind-dn: ${LDAP_BIND_DN:cn=admin,dc=example,dc=org}
  bind-password: ${LDAP_BIND_PASSWORD:}
  cert-attribute: ${LDAP_CERT_ATTR:cACertificate;binary}
  crl-attribute: ${LDAP_CRL_ATTR:certificateRevocationList;binary}

pki:
  security:
    db-encryption-key: ${PKI_DB_ENCRYPTION_KEY}
  cdp:
    url: ${PKI_CDP_URL:http://localhost:8080/api/v1/crl}
  aia:
    ocsp-url: ${PKI_OCSP_URL:http://localhost:8080/api/v1/ocsp}
    ca-issuer-base-url: ${PKI_CA_ISSUER_URL:http://localhost:8080/api/v1/certificates/}